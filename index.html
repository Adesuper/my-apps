<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Apps — Project Hub</title>
<style>
  :root{
    --ink:#1f2430; --muted:#6b7280; --line:#e9e6f2; --bg:#f6f5fb; --card:#ffffff;
    --violet:#6d28d9; --violet2:#a78bfa;
    --live:#16a34a; --live-bg:#dcfce7; --build:#d97706; --build-bg:#fef3c7; --idea:#2563eb; --idea-bg:#dbeafe;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink); background:var(--bg); line-height:1.5;}
  a{color:inherit}
  .wrap{max-width:1150px; margin:0 auto; padding:0 18px 60px;}

  /* Header */
  header.hero{
    background:linear-gradient(135deg,#4c1d95 0%,#6d28d9 45%,#db2777 100%);
    color:#fff; padding:38px 18px 30px; text-align:center;
  }
  header.hero h1{margin:0 0 6px; font-size:2rem; letter-spacing:-.5px;}
  header.hero p{margin:0 auto; max-width:620px; opacity:.92; font-size:1.02rem;}
  .stats{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:18px;}
  .stat{background:rgba(255,255,255,.16); backdrop-filter:blur(4px); border:1px solid rgba(255,255,255,.25);
    border-radius:999px; padding:6px 15px; font-size:.92rem; font-weight:600;}
  .stat b{font-size:1.05rem;}

  /* Controls */
  .controls{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin:22px 0 18px;}
  .search{flex:1; min-width:200px; position:relative;}
  .search input{width:100%; padding:11px 14px 11px 38px; border:1px solid var(--line); border-radius:12px;
    font-size:1rem; background:#fff; outline:none;}
  .search input:focus{border-color:var(--violet2); box-shadow:0 0 0 3px #ede9fe;}
  .search svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.45;}
  .chips{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{border:1px solid var(--line); background:#fff; color:var(--muted); border-radius:999px;
    padding:8px 14px; font-size:.9rem; font-weight:600; cursor:pointer; transition:.15s;}
  .chip:hover{border-color:var(--violet2); color:var(--violet);}
  .chip.active{background:var(--violet); border-color:var(--violet); color:#fff;}

  /* Grid */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px;
    display:flex; flex-direction:column; transition:.18s; box-shadow:0 1px 2px rgba(20,10,40,.04);}
  .card:hover{transform:translateY(-3px); box-shadow:0 14px 30px rgba(76,29,149,.13); border-color:#d8cffb;}
  .card .top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .emoji{font-size:1.9rem; line-height:1; width:52px; height:52px; display:flex; align-items:center;
    justify-content:center; background:#f3effe; border-radius:13px;}
  .badge{font-size:.74rem; font-weight:800; padding:4px 10px; border-radius:999px; white-space:nowrap; letter-spacing:.02em;}
  .badge.live{color:var(--live); background:var(--live-bg);}
  .badge.building{color:var(--build); background:var(--build-bg);}
  .badge.idea{color:var(--idea); background:var(--idea-bg);}
  .card h3{margin:14px 0 3px; font-size:1.18rem;}
  .cat{font-size:.8rem; color:var(--violet); font-weight:700; text-transform:uppercase; letter-spacing:.04em;}
  .desc{margin:10px 0 0; color:#414755; font-size:.95rem;}
  .note{margin:11px 0 0; font-size:.86rem; color:var(--muted); background:#faf9fe; border-left:3px solid var(--violet2);
    padding:7px 10px; border-radius:0 8px 8px 0;}
  .note b{color:var(--ink);}
  .foot{display:flex; align-items:center; gap:10px; margin-top:16px; padding-top:14px; border-top:1px solid var(--line);}
  .updated{font-size:.78rem; color:#9aa1ad; margin-left:auto;}
  .btn{display:inline-flex; align-items:center; gap:6px; text-decoration:none; font-weight:700; font-size:.9rem;
    padding:9px 15px; border-radius:10px; cursor:pointer;}
  .btn.open{background:var(--violet); color:#fff;}
  .btn.open:hover{background:#5b21b6;}
  .btn.code{background:#f1eefb; color:var(--violet);}
  .btn.code:hover{background:#e6dffa;}
  .btn.disabled{background:#f1f2f4; color:#9aa1ad; cursor:default;}
  .empty{text-align:center; color:var(--muted); padding:50px 0;}
  footer.tip{text-align:center; color:var(--muted); font-size:.85rem; margin-top:34px;}
  footer.tip code{background:#ece8f8; padding:2px 7px; border-radius:6px; color:var(--violet);}
</style>
</head>
<body>
  <header class="hero">
    <h1>🚀 My Apps</h1>
    <p>Everything I've built — in one place. Tap a card to open it.</p>
    <div class="stats" id="stats"></div>
  </header>

  <div class="wrap">
    <div class="controls">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" type="search" placeholder="Search apps…" autocomplete="off">
      </div>
      <div class="chips" id="filters"></div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">No apps match that search.</div>
    <footer class="tip">To add or edit an app, open <code>index.html</code> and edit the <code>APPS</code> list at the top of the script. That's it.</footer>
  </div>

<script>
/* ============================================================
   EDIT HERE to add / change apps.
   status: "live" | "building" | "idea"
   url:    live link (leave "" if not online yet)
   repo:   source-code link (optional, "")
   ============================================================ */
const APPS = [
  { name:"Little Lamb Investiture", emoji:"🐑", cat:"Church & Kids", status:"live",
    url:"https://adesuper.github.io/little-lamb-investiture/",
    repo:"https://github.com/Adesuper/little-lamb-investiture",
    desc:"Interactive investiture program — year slideshow, each child's Bible verse (with video clips for any who are away), and the “Oh What a Miracle I Am” song video.",
    note:"Ready for the ceremony.", updated:"Jun 2026" },

  { name:"Bible Women Quiz", emoji:"📖", cat:"Church", status:"live",
    url:"https://adesuper.github.io/bible-women-quiz/",
    repo:"https://github.com/Adesuper/bible-women-quiz",
    desc:"Women of the Bible quiz (NKJV) — 229 questions, daily practice with progress tracking, and a real-time multiplayer team battle.",
    note:"Built for the church conference competition.", updated:"2026" },

  { name:"Truth Quest", emoji:"✝️", cat:"Church & Kids", status:"live",
    url:"https://adesuper.github.io/truth-quest/",
    repo:"https://github.com/Adesuper/truth-quest",
    desc:"“Truth Quest: Walking with Jesus” — a faith-based learning game / quiz for children.",
    note:"Live — refine the content over time.", updated:"2026" },

  { name:"Esorita", emoji:"💼", cat:"Business", status:"building",
    url:"", repo:"https://github.com/Adesuper/esorita",
    desc:"Web app to automate the bridging-finance / proof-of-funds loan business: dashboard, deal tracking, and a fund ledger.",
    note:"<b>Next:</b> finish the MVP (dashboard + deal tracking). Private.", updated:"2026" },

  { name:"Mon Tuteur Français", emoji:"🇫🇷", cat:"Education", status:"building",
    url:"", repo:"https://github.com/Adesuper/mon-tuteur-francais",
    desc:"Primary-2 (Quebec) learning console — French (Pomelo), Math (Kiwi), Culture québécoise, exam prep, plus beginner Python.",
    note:"In use for tutoring. Private repo.", updated:"2026" },

  { name:"Stock Tracker", emoji:"📈", cat:"Finance & Tools", status:"building",
    url:"", repo:"",
    desc:"Dashboard that analyses daily stock performance across technical metrics and gives a buy / hold / sell signal per ticker.",
    note:"<b>Next:</b> host it so it's reachable online. Python app, runs locally.", updated:"2026" },

  { name:"A.M.A — Christian Music", emoji:"🎵", cat:"Music", status:"building",
    url:"", repo:"",
    desc:"Website for the indie Christian music artist — songs, story, and links for fans.",
    note:"<b>Next:</b> publish it (GitHub Pages).", updated:"2026" },

  { name:"Album Video Pipeline", emoji:"🎬", cat:"Music & Content", status:"building",
    url:"", repo:"",
    desc:"Toolkit that turns each album song into Reels, YouTube lyric videos, and audiograms.",
    note:"Local toolkit.", updated:"2026" },

  { name:"Walk With God", emoji:"🎶", cat:"Church & Kids", status:"building",
    url:"", repo:"",
    desc:"Adventurer Day performance — lyric video and song materials for the kids.",
    note:"Local.", updated:"2026" },

  { name:"Musical-Me", emoji:"🎼", cat:"Kids & Music", status:"building",
    url:"", repo:"",
    desc:"Interactive class lesson to praise God with music — meet the instruments, learn the 7 music letters, a mystery-sound game, play a song, and a mini concert. Includes a teacher lesson plan with games.",
    note:"Built &amp; used in the Little Lamb class (local). Could be published online.", updated:"2026" },

  { name:"Graduation Page", emoji:"🎓", cat:"Kids", status:"building",
    url:"", repo:"",
    desc:"Little Lamb graduation celebration page.",
    note:"Local.", updated:"2026" }
];

/* ---------- render ---------- */
const STATUS = { live:{label:"🟢 Live",cls:"live"}, building:{label:"🟡 Building",cls:"building"}, idea:{label:"💡 Idea",cls:"idea"} };
let activeFilter = "all";
const grid = document.getElementById("grid");
const emptyEl = document.getElementById("empty");

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function renderStats(){
  const c = {live:0,building:0,idea:0};
  APPS.forEach(a=>c[a.status]++);
  document.getElementById("stats").innerHTML =
    `<span class="stat"><b>${APPS.length}</b> apps</span>`+
    `<span class="stat"><b>${c.live}</b> live</span>`+
    `<span class="stat"><b>${c.building}</b> building</span>`+
    `<span class="stat"><b>${c.idea}</b> ideas</span>`;
}

function renderFilters(){
  const cats = [...new Set(APPS.map(a=>a.cat))];
  const opts = ["all","live","building","idea",...cats];
  const labels = {all:"All",live:"🟢 Live",building:"🟡 Building",idea:"💡 Ideas"};
  document.getElementById("filters").innerHTML = opts.map(o=>
    `<button class="chip${o===activeFilter?' active':''}" data-f="${esc(o)}">${esc(labels[o]||o)}</button>`).join("");
  document.querySelectorAll(".chip").forEach(ch=>ch.addEventListener("click",()=>{
    activeFilter = ch.dataset.f; renderFilters(); render();
  }));
}

function render(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const list = APPS.filter(a=>{
    const matchF = activeFilter==="all" || a.status===activeFilter || a.cat===activeFilter;
    const matchQ = !q || (a.name+" "+a.cat+" "+a.desc).toLowerCase().includes(q);
    return matchF && matchQ;
  });
  emptyEl.style.display = list.length ? "none" : "block";
  grid.innerHTML = list.map(a=>{
    const st = STATUS[a.status]||STATUS.idea;
    const open = a.url
      ? `<a class="btn open" href="${esc(a.url)}" target="_blank" rel="noopener">Open ↗</a>`
      : `<span class="btn disabled" title="Not online yet">On my computer</span>`;
    const code = a.repo ? `<a class="btn code" href="${esc(a.repo)}" target="_blank" rel="noopener">Code</a>` : "";
    return `<article class="card">
      <div class="top"><div class="emoji">${a.emoji||"📦"}</div><span class="badge ${st.cls}">${st.label}</span></div>
      <h3>${esc(a.name)}</h3>
      <div class="cat">${esc(a.cat)}</div>
      <p class="desc">${a.desc||""}</p>
      ${a.note?`<div class="note">${a.note}</div>`:""}
      <div class="foot">${open}${code}<span class="updated">${esc(a.updated||"")}</span></div>
    </article>`;
  }).join("");
}

renderStats(); renderFilters(); render();
document.getElementById("q").addEventListener("input", render);
</script>
</body>
</html>

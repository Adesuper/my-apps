<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mission évaluations d’Israël</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;500;600;700;800&family=Literata:opsz,wght@7..72,400;7..72,600&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: one column "carnet d'explorateur" on grid paper — two missions (Univers social = sapin, Maths = encre), each topic = learn card + 8-question game. */
:root{
  --paper:#F4F6FC; --panel:#FFFFFF; --panel-2:#FAFBFF;
  --ink:#16213A; --ink-soft:#5A6484; --ink-faint:#8B95B4;
  --rule:#CBD6F2; --grid:rgba(116,148,214,.15); --line:#E2E7F5;
  --marge:#D1495B; --marge-soft:#FBE5E8;
  --encre:#2F4FC9; --encre-soft:#E7ECFC;
  --sapin:#13795B; --sapin-soft:#DFF2EA;
  --vert:#2E8B57; --vert-soft:#E4F4EB;
  --craie:#B57A10; --craie-soft:#FBF0DA;
  --hiver:#3E6FC8; --hiver-soft:#E3ECFB;
  --printemps:#3C9A45; --printemps-soft:#E3F4E4;
  --ete:#C98B00; --ete-soft:#FDF2D2;
  --automne:#C4561E; --automne-soft:#FBE7DB;
  --s1:#2F62C4; --s2:#2E9A4A; --s3:#D9771C; --s4:#8A4FB0; --s5:#179C9C; --s6:#D6455A;
  --b10:#F2C14E; --b10-dark:#B98A17;
  --shadow:0 10px 26px rgba(22,33,58,.09); --shadow-sm:0 2px 8px rgba(22,33,58,.06);
  --display:"Gabarito","Trebuchet MS",system-ui,sans-serif;
  --body:"Literata",Georgia,"Times New Roman",serif;
  --hand:"Caveat","Comic Sans MS",cursive;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F141F; --panel:#171E2D; --panel-2:#1C2435;
    --ink:#E8ECF9; --ink-soft:#A2AECB; --ink-faint:#7A86A6;
    --rule:#2B3752; --grid:rgba(140,170,255,.07); --line:#27314A;
    --marge:#E77A89; --marge-soft:#3A1E26;
    --encre:#8FA8FF; --encre-soft:#1E2946;
    --sapin:#4FC79F; --sapin-soft:#132E26;
    --vert:#66C795; --vert-soft:#16301F;
    --craie:#F0BC63; --craie-soft:#2E2513;
    --hiver:#8FB1F0; --hiver-soft:#1B2740;
    --printemps:#7FD088; --printemps-soft:#18301B;
    --ete:#F2C95A; --ete-soft:#332A10;
    --automne:#F09A6A; --automne-soft:#3A2217;
    --b10:#E2B547; --b10-dark:#8F6A10;
    --shadow:0 10px 26px rgba(0,0,0,.34); --shadow-sm:0 2px 8px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F141F; --panel:#171E2D; --panel-2:#1C2435;
  --ink:#E8ECF9; --ink-soft:#A2AECB; --ink-faint:#7A86A6;
  --rule:#2B3752; --grid:rgba(140,170,255,.07); --line:#27314A;
  --marge:#E77A89; --marge-soft:#3A1E26;
  --encre:#8FA8FF; --encre-soft:#1E2946;
  --sapin:#4FC79F; --sapin-soft:#132E26;
  --vert:#66C795; --vert-soft:#16301F;
  --craie:#F0BC63; --craie-soft:#2E2513;
  --hiver:#8FB1F0; --hiver-soft:#1B2740;
  --printemps:#7FD088; --printemps-soft:#18301B;
  --ete:#F2C95A; --ete-soft:#332A10;
  --automne:#F09A6A; --automne-soft:#3A2217;
  --b10:#E2B547; --b10-dark:#8F6A10;
  --shadow:0 10px 26px rgba(0,0,0,.34); --shadow-sm:0 2px 8px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0;font-family:var(--body);color:var(--ink);background-color:var(--paper);
  background-image:
    repeating-linear-gradient(to bottom, transparent 0 23px, var(--grid) 23px 24px),
    repeating-linear-gradient(to right, transparent 0 23px, var(--grid) 23px 24px);
  line-height:1.6;font-size:16px;-webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
button,input,select{font-family:var(--display);color:inherit;font-size:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--encre);outline-offset:2px;border-radius:8px}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px}

/* header */
header.top{background:var(--panel);border-bottom:1px solid var(--line);padding-block:18px 14px}
.top-in{display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;font-size:.7rem;font-weight:700;color:var(--ink-faint)}
header h1{font-size:clamp(1.6rem,5.4vw,2.2rem);margin-top:3px}
header h1 b{color:var(--marge)}
.me{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-family:var(--display);font-weight:700;font-size:.84rem;background:var(--craie-soft);color:var(--craie);border-radius:99px;padding:5px 12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.rank{background:var(--encre-soft);color:var(--encre)}
.icon-btn{border:1px solid var(--line);background:var(--panel-2);border-radius:99px;width:34px;height:34px;display:grid;place-items:center;padding:0}
.icon-btn svg{width:18px;height:18px;stroke:var(--ink-soft);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow-sm)}
.tabs-in{display:flex;gap:4px;overflow-x:auto;padding-block:8px;scrollbar-width:none}
.tab{font-family:var(--display);font-weight:600;font-size:.92rem;border:none;background:none;padding:8px 13px;border-radius:10px;white-space:nowrap;color:var(--ink-soft)}
.tab[aria-current="true"]{background:var(--ink);color:var(--panel)}
.tab .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}

main{padding-block:22px 80px}
.btn{font-family:var(--display);font-weight:600;font-size:.92rem;border:1px solid var(--line);background:var(--panel-2);padding:9px 15px;border-radius:12px;transition:border-color .12s,transform .1s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover:not(:disabled){border-color:var(--encre)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:var(--encre);border-color:var(--encre);color:var(--panel)}
.btn.us{background:var(--sapin);border-color:var(--sapin);color:var(--panel)}
.btn.ghost{background:transparent}
.btn.small{font-size:.82rem;padding:6px 11px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

.section-k{font-family:var(--display);font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--marge);margin:28px 0 8px}
.lead{font-size:1.03rem;color:var(--ink-soft);max-width:64ch}
.hand{font-family:var(--hand);font-size:1.35rem;line-height:1.3}

/* home: exam tickets */
.hello{font-family:var(--hand);font-size:1.8rem;color:var(--encre);line-height:1.2}
.tickets{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:14px}
.ticket{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px 18px 16px 22px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.ticket::before{content:"";position:absolute;inset:0 auto 0 0;width:7px;background:var(--c)}
.ticket.us{--c:var(--sapin);--cs:var(--sapin-soft)}
.ticket.ma{--c:var(--encre);--cs:var(--encre-soft)}
.ticket .when{font-family:var(--display);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--c)}
.ticket h2{font-size:1.4rem}
.ticket .count{display:flex;align-items:baseline;gap:8px}
.ticket .count b{font-family:var(--display);font-size:2.6rem;line-height:1;color:var(--c);font-variant-numeric:tabular-nums}
.ticket .count span{font-family:var(--display);color:var(--ink-soft);font-weight:600}
.ticket .rule{font-size:.88rem;color:var(--ink-soft)}
.meter{height:8px;border-radius:99px;background:var(--cs);overflow:hidden}
.meter i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .4s}
.meter-l{font-family:var(--display);font-size:.78rem;color:var(--ink-faint)}

/* plan */
.plan{display:flex;flex-direction:column;gap:8px}
.day{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;align-items:start}
.day.today{border-color:var(--marge);box-shadow:0 0 0 2px var(--marge-soft)}
.day.eval{background:var(--craie-soft);border-color:transparent}
.day input[type=checkbox]{width:24px;height:24px;margin:2px 0 0;accent-color:var(--vert)}
.day .d{font-family:var(--display);font-weight:700}
.day .d small{font-weight:600;color:var(--marge);margin-left:6px;letter-spacing:.06em;text-transform:uppercase;font-size:.7rem}
.day .t{font-size:.94rem;color:var(--ink-soft)}
.day .row{grid-column:2;margin-top:4px}
.day.done .d{text-decoration:line-through;text-decoration-color:var(--vert);text-decoration-thickness:2px}

/* mission: topic cards */
.mhead{display:flex;flex-direction:column;gap:6px}
.mhead h2{font-size:clamp(1.4rem,4.4vw,1.9rem)}
.mhead h2 span{color:var(--c)}
.mission{--c:var(--encre);--cs:var(--encre-soft)}
.mission.us{--c:var(--sapin);--cs:var(--sapin-soft)}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:16px}
.topic{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-sm)}
.topic .n{font-family:var(--display);font-size:.72rem;font-weight:700;color:var(--c);letter-spacing:.1em;text-transform:uppercase}
.topic h3{font-size:1.06rem}
.topic p{font-size:.88rem;color:var(--ink-soft);flex:1}
.stars{font-size:1.15rem;letter-spacing:2px;color:var(--line);line-height:1}
.stars .on{color:var(--craie)}
.exam-card{margin-top:14px;background:var(--cs);border-radius:16px;padding:16px 18px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.exam-card h3{font-size:1.15rem}
.exam-card p{font-size:.9rem;color:var(--ink-soft)}

/* learn */
.learn{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.learn h2{font-size:1.45rem}
.learn h3{font-size:1.05rem}
.retenir{background:var(--cs);border-radius:12px;padding:12px 14px}
.retenir h4{font-family:var(--display);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--c);margin-bottom:6px}
.retenir ul{margin:0;padding-left:18px}
.retenir li{margin-bottom:3px}
.piege{border-left:4px solid var(--marge);background:var(--marge-soft);border-radius:0 12px 12px 0;padding:10px 14px;font-size:.95rem}
.piege b:first-child{font-family:var(--display);color:var(--marge)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.fact{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-family:var(--display)}
.fact b{display:block;font-size:1.05rem}
.fact span{font-size:.84rem;color:var(--ink-soft)}
.play-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;background:var(--panel-2);border:1px dashed var(--rule);border-radius:14px;padding:12px 14px}

/* time stairs */
.stairs{display:flex;align-items:flex-end;gap:5px;overflow-x:auto;padding-bottom:4px}
.step{flex:1 0 64px;border:none;border-radius:10px 10px 4px 4px;background:var(--cs);color:var(--c);font-weight:700;font-size:.8rem;padding:6px 2px;display:flex;align-items:flex-end;justify-content:center}
.step[aria-pressed="true"]{background:var(--c);color:var(--panel)}
.infobox{min-height:58px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-family:var(--display)}
.infobox b{color:var(--c)}
.week{display:flex;flex-wrap:wrap;gap:6px}
.week span{font-family:var(--display);font-weight:600;font-size:.85rem;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:3px 9px}

/* nested places */
.nest{border-radius:16px;padding:10px 10px 10px;border:2px solid var(--lv);background:var(--panel)}
.nest .lv{font-family:var(--display);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--lv)}
.nest .nm{font-family:var(--display);font-weight:700;font-size:1rem;margin-bottom:8px}
.nest .nm.blank{color:var(--ink-faint);font-style:italic;font-weight:500}
.nest .nest{margin-top:2px}

/* seasons */
.seasons{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.season{border-radius:14px;padding:10px;background:var(--ss);display:flex;flex-direction:column;gap:6px}
.season h4{font-family:var(--display);color:var(--sc);font-size:1rem}
.season .ms{display:flex;gap:5px;flex-wrap:wrap}
.mbtn{border:1px solid var(--sc);background:var(--panel);color:var(--ink);border-radius:9px;padding:5px 9px;font-size:.86rem;font-weight:600}
.mbtn[aria-pressed="true"]{background:var(--sc);color:var(--panel)}
.s-hiver{--sc:var(--hiver);--ss:var(--hiver-soft)} .s-printemps{--sc:var(--printemps);--ss:var(--printemps-soft)}
.s-ete{--sc:var(--ete);--ss:var(--ete-soft)} .s-automne{--sc:var(--automne);--ss:var(--automne-soft)}
.cycle{font-family:var(--display);font-weight:700;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cycle span{padding:3px 10px;border-radius:99px;background:var(--ss);color:var(--sc)}

/* map + timeline */
.mapbox{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.mapbox .svgwrap{flex:1 1 320px;min-width:0;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:6px}
.mapbox svg{width:100%;height:auto;display:block}
.legend{flex:0 1 190px;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-family:var(--display);font-size:.88rem}
.legend h5{margin:0 0 6px;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}
.legend div{display:flex;align-items:center;gap:8px;margin:3px 0}
.legend svg{width:20px;height:20px;flex:0 0 20px}
.m-road{fill:var(--rule)} .m-txt{fill:var(--ink);font-family:var(--display);font-size:14px;text-anchor:middle}
.m-title{fill:var(--ink);font-family:var(--display);font-size:19px;font-weight:700;text-anchor:middle}
.m-cmp{fill:var(--ink);font-family:var(--display);font-size:13px;font-weight:700;text-anchor:middle}
.m-arrow{stroke:var(--ink);stroke-width:2.5;fill:none}
.vocab{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.vocab div{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.vocab b{font-family:var(--display);color:var(--c);display:block}
.vocab span{font-size:.9rem;color:var(--ink-soft)}
.tlwrap{overflow-x:auto;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:6px}
.tlwrap svg{display:block;width:100%;min-width:400px;height:auto}
.tl-axis{stroke:var(--ink);stroke-width:3} .tl-arrow{fill:var(--ink)} .tl-dot{fill:var(--encre)}
.tl-year{fill:var(--ink);font-family:var(--display);font-size:15px;font-weight:700;text-anchor:middle}
.tl-lab{fill:var(--ink-soft);font-family:var(--display);font-size:12.5px;text-anchor:middle}
.tl-title{fill:var(--ink);font-family:var(--display);font-size:15px;font-weight:700;text-anchor:middle}

/* maths visuals */
.numtab{border-collapse:collapse;font-family:var(--display);font-variant-numeric:tabular-nums}
.numtab th,.numtab td{border:1.5px solid var(--rule);padding:4px 12px;text-align:center;min-width:48px}
.numtab th{font-size:.8rem;color:var(--ink-soft);background:var(--panel-2)}
.numtab td{font-size:1.35rem;font-weight:700}
.numtab td.hi{background:var(--craie-soft);color:var(--craie)}
.b10{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:12px}
.b10 .grp{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-end;max-width:100%}
.b10 svg{display:block}
.b-face{fill:var(--b10);stroke:var(--b10-dark);stroke-width:1}
.b-side{fill:var(--b10-dark);stroke:var(--b10-dark);stroke-width:1}
.b-grid{stroke:var(--b10-dark);stroke-width:.6;fill:none}
.abaque svg{width:100%;max-width:300px;height:auto;display:block}
.ab-rod{stroke:var(--ink-faint);stroke-width:4;stroke-linecap:round}
.ab-base{fill:var(--ink-soft)}
.ab-lab{fill:var(--ink);font-family:var(--display);font-size:14px;font-weight:700;text-anchor:middle}
.ab-builder{display:flex;flex-direction:column;align-items:center;gap:8px}
.ab-ctrls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:300px}
.ab-ctrls div{display:flex;flex-direction:column;gap:4px}
.ab-ctrls button{border:1px solid var(--line);background:var(--panel);border-radius:9px;font-weight:700;font-size:1.05rem;padding:4px 0}
.clock{width:200px;max-width:100%;height:auto;display:block}
.ck-face{fill:var(--panel);stroke:var(--ink);stroke-width:4}
.ck-tick{stroke:var(--ink-faint);stroke-width:1.4} .ck-tick.big{stroke:var(--ink);stroke-width:3}
.ck-num{fill:var(--ink);font-family:var(--display);font-size:17px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.ck-h{stroke:var(--marge);stroke-width:7;stroke-linecap:round}
.ck-m{stroke:var(--encre);stroke-width:4.5;stroke-linecap:round}
.ck-c{fill:var(--ink)}
.clock-play{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.clock-ctrls{display:grid;grid-template-columns:repeat(2,auto);gap:6px}
.readout{font-family:var(--display);font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
.readout small{display:block;font-size:.95rem;font-weight:600;color:var(--ink-soft)}
.lab{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.lab-in{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lab-in input{width:130px;font-size:1.5rem;font-weight:800;padding:6px 10px;border:2px solid var(--rule);border-radius:12px;background:var(--panel-2);font-variant-numeric:tabular-nums}
.lab-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.lab-grid > div{min-width:0}
.lab-k{font-family:var(--display);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin-bottom:4px}
.lab-words{font-family:var(--hand);font-size:1.6rem;line-height:1.2;color:var(--encre)}
.lab-list{font-family:var(--display);font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-family:var(--display);font-weight:700;font-size:.85rem;padding:2px 10px;border-radius:99px;background:var(--vert-soft);color:var(--vert)}
.badge.odd{background:var(--automne-soft);color:var(--automne)}

/* quiz */
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qtitle{font-family:var(--display);font-weight:700;flex:1 1 160px}
.qcount{font-family:var(--display);font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.progress{height:10px;border-radius:99px;background:var(--cs);overflow:hidden;margin:10px 0 14px}
.progress i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .3s}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.qvis{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.qvis > *{max-width:100%}
.prompt{font-family:var(--display);font-size:clamp(1.15rem,3.6vw,1.4rem);font-weight:600;line-height:1.35}
.prompt b{color:var(--c)}
.bignum{font-family:var(--display);font-size:clamp(2rem,8vw,2.8rem);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.bigwords{font-family:var(--hand);font-size:clamp(1.7rem,6vw,2.2rem);line-height:1.2;color:var(--encre)}
.retry-tag{align-self:flex-start;font-family:var(--display);font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--craie-soft);color:var(--craie);border-radius:99px;padding:3px 10px}
.say{border:1px solid var(--line);background:var(--panel-2);border-radius:99px;padding:5px 12px 5px 9px;font-weight:600;font-size:.84rem;display:inline-flex;gap:6px;align-items:center;color:var(--ink-soft)}
.say svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:9px}
.choice{border:2px solid var(--line);background:var(--panel-2);border-radius:14px;padding:12px 14px;font-size:1.08rem;font-weight:600;text-align:left;line-height:1.3;transition:border-color .12s,transform .1s}
.choice:hover:not(:disabled){border-color:var(--c);transform:translateY(-1px)}
.choice:disabled{cursor:default}
.choice.ok{border-color:var(--vert);background:var(--vert-soft);color:var(--vert)}
.choice.no{border-color:var(--marge);background:var(--marge-soft);color:var(--marge)}
.choices.cmp{grid-template-columns:repeat(3,1fr);max-width:360px}
.choices.cmp .choice{font-size:2rem;text-align:center;padding:6px}
.cmpbox{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-family:var(--display);font-weight:800;font-size:clamp(1.3rem,5vw,1.9rem);font-variant-numeric:tabular-nums}
.cmpbox .slot{width:52px;height:52px;border:3px dashed var(--c);border-radius:12px;display:grid;place-items:center;color:var(--c)}
.ansform{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.ansform input{flex:0 1 220px;min-width:0;font-size:1.5rem;font-weight:700;padding:9px 14px;border:2px solid var(--rule);border-radius:14px;background:var(--panel-2);font-variant-numeric:tabular-nums}
.ansform input:focus{border-color:var(--c);outline:none}
.ansform .unit{font-family:var(--display);font-weight:600;color:var(--ink-soft)}
.order-slots{display:flex;flex-wrap:wrap;gap:8px;min-height:50px;padding:8px;border:2px dashed var(--rule);border-radius:14px;align-items:center}
.order-slots .ph{color:var(--ink-faint);font-family:var(--display);font-size:.9rem}
.order-pool{display:flex;flex-wrap:wrap;gap:8px}
.chipb{border:2px solid var(--c);background:var(--panel);color:var(--ink);border-radius:99px;padding:7px 14px;font-weight:700;font-size:1rem}
.chipb.placed{background:var(--cs)}
.chipb .k{font-variant-numeric:tabular-nums;color:var(--c);margin-right:5px}
.fb{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--vert-soft)}
.fb.no{background:var(--marge-soft)}
.fb .h{font-family:var(--display);font-weight:800;font-size:1.2rem}
.fb.ok .h{color:var(--vert)} .fb.no .h{color:var(--marge)}
.fb .x{font-size:.98rem}
.fb .x .numtab td{font-size:1.1rem}

/* result */
.result{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.result .score{font-family:var(--display);font-size:3rem;font-weight:800;line-height:1;color:var(--c);font-variant-numeric:tabular-nums}
.result .bigstars{font-size:2.6rem;letter-spacing:6px;color:var(--line);line-height:1}
.result .bigstars .on{color:var(--craie)}
.review{display:flex;flex-direction:column;gap:10px;width:100%}
.rev{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--panel-2)}
.rev .qvis svg{max-width:420px}
.rev .ans{font-family:var(--display);font-size:.95rem}
.rev .ans .bad{color:var(--marge);text-decoration:line-through}
.rev .ans .good{color:var(--vert);font-weight:700}

/* parents */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-family:var(--display);font-weight:600;font-size:.9rem}
.form input,.form select{padding:9px 12px;border:1.5px solid var(--rule);border-radius:11px;background:var(--panel-2);font-size:1rem}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.box ul{margin:0;padding-left:20px}
.box li{margin-bottom:4px}
.tbl{width:100%;border-collapse:collapse;font-family:var(--display);font-size:.9rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl th{color:var(--ink-faint);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase}
.tblwrap{overflow-x:auto}
.muted{color:var(--ink-faint);font-size:.9rem}

#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);font-family:var(--display);font-weight:700;padding:10px 18px;border-radius:99px;box-shadow:var(--shadow);z-index:50}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40;width:100%;height:100%}
footer{border-top:1px solid var(--line);margin-top:34px;padding-top:14px;font-size:.84rem;color:var(--ink-faint)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function symSVG(k,x,y,r,col){
  const st=`style="fill:var(${col})"`;
  switch(k){
    case "square":return `<rect x="${x-r}" y="${y-r}" width="${2*r}" height="${2*r}" rx="2" ${st}/>`;
    case "circle":return `<circle cx="${x}" cy="${y}" r="${r}" ${st}/>`;

    case "diamond":return `<path d="M${x} ${y-r*1.3} L${x+r*1.3} ${y} L${x} ${y+r*1.3} L${x-r*1.3} ${y}Z" ${st}/>`;

}

  <div class="play-bar"><div><b style="font-family:var(--display)">Prêt ? 8 questions.</b> ${starsHTML(S.stars[id]||0)}</div><div class="row"><button class="btn ${isUS?"us":"primary"}" data-quiz="${id}">Jouer</button>${nx?`<button class="btn small ghost" data-go="t-${nx}">Thème suivant →</button>`:""}</div></div></div></section>`;
  labInit(app);
  if(id==="temps")$$(".step").forEach(b=>b.onclick=()=>{$$(".step").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");const s=STEPS[+b.dataset.step];$("#stepInfo").innerHTML=`<b>${cap(s[0])}</b> · ${s[1]} · ${s[2]}`});
  if(id==="annee")$$(".mbtn").forEach(b=>b.onclick=()=>{$$(".mbtn").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");const m=+b.dataset.month,fs=FETES.filter(f=>f.m===m||(f.m===null&&(m===2||m===3)));$("#monthInfo").innerHTML=`<b>${cap(MOIS[m])}</b> · ${m+1}<sup>e</sup> mois de l’année${SURE_MONTHS.includes(m)?" · "+MSEASON[m]:" · entre deux saisons"}${fs.length?" · "+fs.map(f=>cap(f.n)+(f.m===null?" (parfois)":" le "+f.d)).join(", "):""}${S.anniv!==""&&+S.anniv===m?" · ton anniversaire !":""}`});
  if(id==="heure"){let t=180;const upd=()=>{const h=Math.floor(t/60)%12||12,m=t%60;$("#toyClock").innerHTML=clockSVG(h,m);$("#toyRead").innerHTML=`${tfmt(h,m)}<small>${twords(h,m)}</small>`};upd();$$("[data-toy]").forEach(b=>b.onclick=()=>{t=(t+ +b.dataset.toy+720)%720;upd()})}
}
function labHTML(n){return `<div class="lab" data-lab="${n||""}"><div class="lab-in"><label for="labN" style="font-family:var(--display);font-weight:700">Le laboratoire des nombres</label><input id="labN" inputmode="numeric" maxlength="5" aria-label="Nombre de 0 à 9 999"><button class="btn small" data-labrand>Au hasard</button></div><div class="lab-out"></div></div>`}
function labInit(root){
  const lab=$(".lab",root);if(!lab)return;const inp=$("#labN",lab),out=$(".lab-out",lab);
  const show=()=>{let n=parseInt(inp.value.replace(/\D/g,""),10);if(isNaN(n)){out.innerHTML=`<p class="muted">Écris un nombre de 0 à 9 999.</p>`;return}n=Math.min(9999,n);const d=dig(n);
    out.innerHTML=`<div class="lab-grid"><div><div class="lab-k">En lettres</div><p class="lab-words">${fr(n)}</p></div>
    <div><div class="lab-k">Tableau de numération</div>${tabHTML(n)}</div>
    <div><div class="lab-k">Décomposé</div><p class="lab-list">${n?[d.m*1000,d.c*100,d.d*10,d.u].filter(x=>x).map(fmt).join(" + "):"0"} = ${fmt(n)}</p><p style="margin-top:6px"><span class="badge${n%2?" odd":""}">${n%2?"impair":"pair"}</span></p></div>
    <div><div class="lab-k">Il y a combien de…</div><p class="lab-list">${Math.floor(n/1000)} unité${Math.floor(n/1000)>1?"s":""} de mille<br>${Math.floor(n/100)} centaine${Math.floor(n/100)>1?"s":""}<br>${Math.floor(n/10)} dizaine${Math.floor(n/10)>1?"s":""}<br>${fmt(n)} unité${n>1?"s":""}</p></div>
    <div><div class="lab-k">Abaque</div><div class="abaque">${abaqueSVG([d.m,d.c,d.d,d.u])}</div></div>
    <div><div class="lab-k">Base dix</div>${b10HTML(d)}</div></div>`};
  inp.value=lab.dataset.lab||String(R(1000,9999));inp.oninput=show;$("[data-labrand]",lab).onclick=()=>{inp.value=String(rNum());show()};show();
}

/* ---------- jeu ---------- */
let Q=null;
function startQuiz(kind){
  let list,mode="practice",title,subj;
  if(TOPICS[kind]){list=gen(kind,8);title=TOPICS[kind].n;subj=TOPICS[kind].s}
  else if(kind==="exam-us"){mode="exam";subj="us";title="Examen blanc · univers social";list=US_IDS.flatMap(id=>gen(id,4))}
  else if(kind==="exam-ma"){mode="exam";subj="ma";title="Examen blanc · maths";list=MA_IDS.flatMap(id=>gen(id,id==="problemes"||id==="comparer"?3:2))}
  else{subj=kind==="warm-us"?"us":"ma";title="Échauffement";const ids=subj==="us"?US_IDS:MA_IDS;list=shuffle(ids).slice(0,6).map(id=>gen(id,1)[0])}
  if(mode==="exam")list=shuffle(list);
  Q={kind,mode,title,subj,list,i:0,first:0,base:list.length,log:[],done:false};go("quiz");
}
function viewQuiz(){
  const q=Q.list[Q.i],pct=Q.i/Q.list.length*100;
  app.innerHTML=`<section class="mission ${Q.subj}"><div class="qhead"><button class="btn small ghost" data-act="quit">← Quitter</button><span class="qtitle">${Q.title}</span><span class="qcount">${Q.i+1} / ${Q.list.length}</span></div>
  <div class="progress"><i style="width:${pct}%"></i></div>
  <div class="qcard">${q.retry?`<span class="retry-tag">Deuxième chance</span>`:""}${q.vis?`<div class="qvis">${q.vis}</div>`:""}<p class="prompt">${q.p}</p>
  <div>${sayBtn(strip(q.p),"Lis-moi la question")}</div>
  <div id="qans"></div><div id="fb" class="fb" hidden></div></div></section>`;
  answerUI(q,$("#qans"));
}
function answerUI(q,box){
  if(q.type==="choice"){box.innerHTML=`<div class="choices ${q.cls||""}">${q.choices.map((c,i)=>`<button class="choice" data-c="${i}">${c}</button>`).join("")}</div>`;$$(".choice",box).forEach(b=>b.onclick=()=>submit(q.choices[+b.dataset.c],b))}
  else if(q.type==="input"){box.innerHTML=`<form class="ansform" id="af"><input id="ans" autocomplete="off" inputmode="${typeof q.answer==="number"?"numeric":"text"}" aria-label="Ta réponse">${q.unit?`<span class="unit">${q.unit}</span>`:""}<button class="btn ${Q.subj==="us"?"us":"primary"}">Vérifier</button></form>`;const f=$("#af");f.onsubmit=e=>{e.preventDefault();const v=$("#ans").value.trim();if(!v){$("#ans").focus();return}submit(v)};setTimeout(()=>{try{$("#ans").focus({preventScroll:true})}catch(e){}},50)}
  else if(q.type==="order"){const pool=shuffle(q.items),seq=[];
    const draw=()=>{box.innerHTML=`<div class="order-slots">${seq.length?seq.map((s,i)=>`<button class="chipb placed" data-back="${i}"><span class="k">${i+1}</span>${s}</button>`).join(""):`<span class="ph">Touche les étiquettes dans le bon ordre…</span>`}</div>
      <div class="order-pool" style="margin-top:10px">${pool.filter(p=>!seq.includes(p)).map(p=>`<button class="chipb" data-it="${pool.indexOf(p)}">${p}</button>`).join("")}</div>
      <div class="row" style="margin-top:12px"><button class="btn ${Q.subj==="us"?"us":"primary"}" id="oc" ${seq.length<pool.length?"disabled":""}>Vérifier</button><button class="btn small ghost" id="or">Recommencer</button></div>`;
      $$("[data-it]",box).forEach(b=>b.onclick=()=>{seq.push(pool[+b.dataset.it]);draw()});$$("[data-back]",box).forEach(b=>b.onclick=()=>{seq.splice(+b.dataset.back,1);draw()});
      $("#or",box).onclick=()=>{seq.length=0;draw()};$("#oc",box).onclick=()=>submit(seq.slice())};draw()}
  else if(q.type==="clock"){let t=720;const draw=()=>{const h=Math.floor(t/60)%12||12,m=t%60;box.innerHTML=`<div class="clock-play"><div>${clockSVG(h,m)}</div><div style="display:flex;flex-direction:column;gap:10px"><div class="clock-ctrls"><button class="btn small" data-k="-60">− 1 heure</button><button class="btn small" data-k="60">+ 1 heure</button><button class="btn small" data-k="-5">− 5 min</button><button class="btn small" data-k="5">+ 5 min</button></div><button class="btn ${Q.subj==="us"?"us":"primary"}" id="cc">Vérifier</button></div></div>`;
      $$("[data-k]",box).forEach(b=>b.onclick=()=>{t=(t+ +b.dataset.k+720)%720;draw()});$("#cc",box).onclick=()=>submit({h:Math.floor(t/60)%12||12,m:t%60})};draw()}
  else if(q.type==="abaque"){const v=[0,0,0,0];const draw=()=>{box.innerHTML=`<div class="ab-builder"><div class="abaque" style="width:100%;max-width:300px">${abaqueSVG(v)}</div><div class="ab-ctrls">${["UM","C","D","U"].map((l,i)=>`<div><button data-ab="${i}" data-d="1" aria-label="Ajouter une perle ${l}">+</button><button data-ab="${i}" data-d="-1" aria-label="Enlever une perle ${l}">−</button></div>`).join("")}</div><button class="btn primary" id="abc">Vérifier</button></div>`;
      $$("[data-ab]",box).forEach(b=>b.onclick=()=>{const i=+b.dataset.ab;v[i]=Math.max(0,Math.min(9,v[i]+ +b.dataset.d));draw()});$("#abc",box).onclick=()=>submit(v[0]*1000+v[1]*100+v[2]*10+v[3])};draw()}
}
function isRight(q,v){
  if(q.type==="order")return v.join("|")===q.answer.join("|");
  if(q.type==="clock")return v.h%12===q.answer.h%12&&v.m===q.answer.m;
  if(q.type==="abaque")return v===q.answer;
  return norm(v)===norm(q.answer);
}
const showAns=q=>q.type==="order"?q.answer.join(" → "):q.type==="clock"?tfmt(q.answer.h,q.answer.m):typeof q.answer==="number"?fmt(q.answer)+(q.unit?" "+q.unit:""):q.answer;
const showVal=(q,v)=>q.type==="order"?v.join(" → "):q.type==="clock"?tfmt(v.h,v.m):typeof v==="number"?fmt(v):v;
function submit(v,btn){
  if(Q.done)return;const q=Q.list[Q.i],ok=isRight(q,v);Q.done=true;
  if(!q.retry){Q.log.push({q,v,ok});if(ok){Q.first++;S.xp+=10}}else if(ok)S.xp+=5;
  save();refreshHead();
  if(Q.mode==="exam"){nextQ();return}
  if(!ok&&!q.retry)Q.list.push(Object.assign({},q,{retry:true}));
  $$("#qans button, #qans input").forEach(b=>b.disabled=true);
  if(q.type==="choice"){$$(".choice").forEach(b=>{const c=q.choices[+b.dataset.c];if(norm(c)===norm(q.answer))b.classList.add("ok");else if(b===btn)b.classList.add("no")})}
  const fb=$("#fb");fb.hidden=false;fb.className="fb "+(ok?"ok":"no");
  fb.innerHTML=ok?`<span class="h">${pick(["Bravo !","Excellent !","Super, Israël !","Exactement !","Tu es en feu !","Parfait !"])}</span>${q.retry?"":`<span class="x">+10 points</span>`}<div><button class="btn primary" id="nx">${Q.i+1<Q.list.length?"Question suivante →":"Voir mon résultat"}</button></div>`
    :`<span class="h">Presque !</span><div class="x">La bonne réponse : <b>${showAns(q)}</b>${q.type==="input"?` (tu as écrit ${showVal(q,v)})`:""}</div><div class="x">${q.explain||""}</div><div class="x muted">${q.retry?"":"Cette question reviendra à la fin pour une deuxième chance."}</div><div><button class="btn primary" id="nx">${Q.i+1<Q.list.length?"Question suivante →":"Voir mon résultat"}</button></div>`;
  ok?sGood():sBad();
  $("#nx").onclick=nextQ;setTimeout(()=>{try{$("#nx").focus({preventScroll:true});fb.scrollIntoView({block:"nearest",behavior:"smooth"})}catch(e){}},30);
}
function nextQ(){Q.done=false;Q.i++;if(Q.i>=Q.list.length){finish();return}viewQuiz()}
function finish(){
  const pct=Q.first/Q.base;let st=0;
  if(Q.mode==="practice"&&TOPICS[Q.kind]){st=pct>=.875?3:pct>=.7?2:pct>=.5?1:0;if(st>(S.stars[Q.kind]||0))S.stars[Q.kind]=st}
  if(Q.mode==="exam"){S.exams.push({k:Q.kind,s:Q.first,t:Q.base,d:new Date().toISOString().slice(0,16).replace("T"," ")})}
  Q.stars=st;save();go("result");
  if(pct>=.85){sWin();confetti()}
}
function viewResult(){
  const isExam=Q.mode==="exam",pct=Q.first/Q.base,miss=Q.log.filter(l=>!l.ok);
  let msg;
  if(isExam)msg=Q.first>=18?"Notions bien maîtrisées ! Refais l’examen demain dans un autre ordre pour être sûr.":Q.first>=14?"Très bien ! Reprends les thèmes de tes erreurs (en bas), puis refais un petit rappel demain.":"Bon entraînement. On reprend deux thèmes à la fois avec l’onglet Apprendre, puis on refait un examen.";
  else msg=pct>=.875?"Thème maîtrisé ! Tu peux passer au suivant.":pct>=.5?"Bon travail ! Rejoue une fois pour aller chercher les 3 étoiles.":"Relis la page Apprendre, puis rejoue. Tu vas y arriver !";
  const topicsMissed=[...new Set(miss.map(l=>l.q.topic))];
  app.innerHTML=`<section class="mission ${Q.subj}"><div class="result">
    <p class="eyebrow">${Q.title}</p>
    <div class="score">${Q.first} / ${Q.base}</div>
    ${isExam?"":starsHTML(Q.stars,"bigstars")}
    <p class="lead">${msg}</p>
    <div class="row">${isExam?`<button class="btn ${Q.subj==="us"?"us":"primary"}" data-quiz="${Q.kind}">Refaire un examen</button>`:`<button class="btn ${Q.subj==="us"?"us":"primary"}" data-quiz="${Q.kind}">Rejouer</button>`}<button class="btn ghost" data-go="${Q.subj}">Retour à la mission</button>${!isExam&&TOPICS[Q.kind]?(()=>{const ids=Q.subj==="us"?US_IDS:MA_IDS,nx=ids[ids.indexOf(Q.kind)+1];return nx?`<button class="btn ghost" data-go="t-${nx}">Thème suivant →</button>`:""})():""}</div>
    ${isExam&&topicsMissed.length?`<p class="section-k" style="margin-top:6px">Thèmes à revoir</p><div class="row">${topicsMissed.map(t=>`<button class="btn small" data-go="t-${t}">${TOPICS[t].n}</button>`).join("")}</div>`:""}
    ${miss.length?`<p class="section-k" style="margin-top:6px">${isExam?"La correction":"Mes erreurs"}</p><div class="review">${miss.map(l=>`<div class="rev">${l.q.vis?`<div class="qvis">${l.q.vis}</div>`:""}<p class="prompt" style="font-size:1.05rem">${l.q.p}</p><p class="ans">Ta réponse : <span class="bad">${showVal(l.q,l.v)}</span> · Bonne réponse : <span class="good">${showAns(l.q)}</span></p><div class="muted">${l.q.explain||""}</div></div>`).join("")}</div>`:`<p class="hand" style="color:var(--vert)">Aucune erreur. Wow !</p>`}
  </div></section>`;
}
function viewParents(){
  const ex=S.exams.slice().reverse();
  app.innerHTML=`<p class="section-k" style="margin-top:0">Pour les parents</p>
  <div class="box"><h3>Ses réponses personnelles</h3><p class="muted">Elles servent dans « De ma planète à ma rue » et « Mois, saisons et fêtes ». On les vérifie avec lui plutôt que de lui faire apprendre une réponse inventée.</p>
    <div class="form"><label for="fVille">Sa ville<input id="fVille" value="${S.ville.replace(/"/g,"&quot;")}" placeholder="ex. Gatineau"></label><label for="fRue">Sa rue<input id="fRue" value="${S.rue.replace(/"/g,"&quot;")}" placeholder="ex. rue des Érables"></label>
    <label for="fAnniv">Mois de son anniversaire<select id="fAnniv"><option value="">—</option>${MOIS.map((m,i)=>`<option value="${i}" ${String(S.anniv)===String(i)?"selected":""}>${m}</option>`).join("")}</select></label></div>
    <div class="row"><button class="btn primary" id="saveP">Enregistrer</button></div></div>
  <p class="section-k">Ce que l’enseignante a annoncé</p>
  <div class="box"><h3>Univers social · lundi 5 octobre</h3><ul><li>Sans cahier de notes : la révision a été faite en classe, un peu d’étude à la maison est conseillée.</li><li>Unités de temps (secondes à siècles), de ma planète à ma rue, mois/saisons/fêtes (les fêtes les plus connues des enfants seulement), vocabulaire de la carte, lecture d’une ligne du temps (sa ligne du temps de l’école sert d’exemple).</li></ul>
    <h3>Mathématiques · jeudi 8 octobre</h3><ul><li>Nombres de 0 à 9 999 : écrire, représenter (tableau, base 10, abaque), position et valeur, « il y a combien de… », décomposer, comparer avec &lt; &gt; =, pair/impair.</li><li>Lire et écrire l’heure sur une horloge à aiguilles. Petits problèmes de numération.</li><li>Résumé théorique : <b>Tam Tam, cahier des savoirs, p. 7, 8, 9, 10, 11, 40 et 43</b> (onglet math du cartable de leçons). Il peut utiliser ses stratégies et son matériel de manipulation.</li></ul></div>
  <p class="section-k">Comment l’aider</p>
  <div class="box"><ul><li>Sessions courtes (15 à 20 min) en suivant le plan de l’accueil. Mieux vaut un peu chaque jour.</li><li>Pour chaque erreur : « Comment as-tu choisi ? », montrer le repère (la légende, la rose des vents, le tableau), le laisser reformuler. Le jeu ramène la question à la fin.</li><li>Le bouton « Lis-moi la question » lit la consigne à voix haute s’il bloque sur la lecture. À l’école, il devra lire seul : encouragez-le à lire d’abord, puis à écouter pour vérifier.</li><li>Examen blanc : 18 à 20 = bien maîtrisé · 14 à 17 = revoir les thèmes des erreurs · 13 ou moins = reprendre deux thèmes à la fois. Ces repères organisent la révision ; ils ne prédisent pas la note.</li><li>Les cartes et lignes du temps du jeu sont inventées pour l’exercice ; la carte « Le quartier des amis » et la ligne de Léa sont celles du guide de révision.</li></ul></div>
  <p class="section-k">Examens blancs faits</p>
  <div class="box">${ex.length?`<div class="tblwrap"><table class="tbl"><tr><th>Date</th><th>Examen</th><th>Score</th></tr>${ex.map(e=>`<tr><td>${e.d}</td><td>${e.k==="exam-us"?"Univers social":"Maths"}</td><td><b>${e.s} / ${e.t}</b></td></tr>`).join("")}</table></div>`:`<p class="muted">Aucun examen blanc pour l’instant. Les scores apparaîtront ici.</p>`}
    <p class="muted">Étoiles par thème : ${Object.keys(TOPICS).map(k=>`${TOPICS[k].n} ${"★".repeat(S.stars[k]||0)||"–"}`).join(" · ")}</p>
    <div class="row"><button class="btn small ghost" id="rst">Effacer toute la progression</button><span id="rstc" hidden class="row"><span class="muted">Sûr ? Les étoiles et les scores seront effacés.</span><button class="btn small" id="rsty" style="border-color:var(--marge);color:var(--marge)">Oui, effacer</button><button class="btn small ghost" id="rstn">Annuler</button></span></div></div>`;
  $("#saveP").onclick=()=>{S.ville=$("#fVille").value.trim();S.rue=$("#fRue").value.trim();S.anniv=$("#fAnniv").value;save();toast("Enregistré")};
  $("#rst").onclick=()=>{$("#rstc").hidden=false};$("#rstn").onclick=()=>{$("#rstc").hidden=true};
  $("#rsty").onclick=()=>{Object.assign(S,{stars:{},xp:0,plan:{},exams:[]});save();toast("Progression effacée");render()};
}

/* ============ événements ============ */
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g){go(g.dataset.go);return}
  const qz=e.target.closest("[data-quiz]");if(qz){startQuiz(qz.dataset.quiz);return}
  const sp=e.target.closest("[data-say]");if(sp){say(sp.dataset.say);return}
  if(e.target.closest("[data-act=quit]")){const k=Q&&Q.kind,sj=Q&&Q.subj;Q=null;go(TOPICS[k]?"t-"+k:(sj||"home"));return}
});
document.addEventListener("change",e=>{const p=e.target.closest("[data-plan]");if(p){S.plan[p.dataset.plan]=p.checked;save();p.closest(".day").classList.toggle("done",p.checked);if(p.checked){sGood();toast("Journée cochée. Bravo !")}}});
$("#soundBtn").onclick=()=>{S.sound=!S.sound;save();refreshHead()};
const h=(location.hash||"").slice(1);
VIEW=(["home","us","ma","parents"].includes(h)||(h.startsWith("t-")&&TOPICS[h.slice(2)]))?h:"home";
render();
})();
</script>
